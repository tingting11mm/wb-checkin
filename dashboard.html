<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy 积分看板</title>
<style>
  :root{
    --bg:#eef4fb; --card:#ffffff; --ink:#12263f; --ink-2:#5b6b80;
    --ink-3:#93a1b1; --line:#eaf0f7; --green:#1fb574; --green-bg:#e8f8f0;
    --blue:#3d7cf5; --blue-soft:#eaf1ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:18px 14px 40px;max-width:100%;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#e9f1fa 0%,#f7fbff 42%,#ffffff 100%);
    color:var(--ink);min-height:100vh;
  }
  .wrap{max-width:420px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
          flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0}
  .brand b{color:var(--ink);font-size:15px;letter-spacing:.2px}
  #stamp{font-size:11px;color:var(--ink-3);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .title{font-size:21px;font-weight:700;letter-spacing:.3px;margin:0 0 12px}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 12px;border-radius:999px;background:#fff;color:var(--ink-2);
        border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
  .chip.ok{background:var(--green-bg);color:#0f8f5b;border-color:#d3f0e2;font-weight:600}
  .chip .pulse{width:6px;height:6px;border-radius:50%;background:#0f8f5b}

  .card{background:var(--card);border-radius:18px;padding:18px;
        box-shadow:0 2px 10px rgba(23,63,120,.05);border:1px solid #f1f5fa}
  .hero{margin-bottom:12px}
  .label{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
  .big{display:flex;align-items:baseline;gap:6px}
  .big .num{font-size:43px;font-weight:700;letter-spacing:-1px;line-height:1.05;
             font-variant-numeric:tabular-nums}
  .big .unit{font-size:14px;color:var(--ink-2)}
  .meta{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.7}
  .rows{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--ink-2)}
  .row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
  .mini{padding:14px 15px}
  .mini .k{font-size:12px;color:var(--ink-2);margin-bottom:8px}
  .mini .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .mini .v.green{color:var(--green)}
  .mini .v.warn{color:#e0803a}
  .mini .sub{font-size:11.5px;color:var(--ink-3);margin-top:5px}

  .sec-title{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 10px;padding-left:2px}
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .day{background:#f6f9fd;border-radius:10px;padding:8px 0 6px;text-align:center;
       border:1px solid transparent}
  .day.ok{background:var(--green-bg);border-color:#dcf3e7}
  .day .mark{height:13px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
  .day .mark svg{width:12px;height:12px}
  .day .dn{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .day.ok .dn{color:#0f8f5b}
  .day:not(.ok) .dn{color:var(--ink-3)}
  .day .dm{font-size:9.5px;color:var(--ink-3);margin-top:1px}
  .day.today{box-shadow:0 0 0 2px #cfe3ff inset}

  .detail .row{align-items:center}
  .bar{height:6px;border-radius:6px;background:var(--blue-soft);margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#5b9bff,#3d7cf5);border-radius:6px}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-3);line-height:1.9}
  .badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;
         background:var(--blue-soft);color:#2f6ad0;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><b>WorkBuddy</b><span>积分看板</span></div>
    <div class="brand" id="stamp">—</div>
  </div>

  <h1 class="title">WorkBuddy 每日签到</h1>

  <div class="chips">
    <span class="chip">跟随系统</span>
    <span class="chip ok" id="chipToday"><span class="pulse"></span><span>今日已自动领取</span></span>
  </div>

  <div class="card hero">
    <div class="label">当前剩余积分</div>
    <div class="big"><span class="num" id="points">—</span><span class="unit">分</span></div>
    <div class="meta" id="capacity">—</div>
    <div class="rows">
      <div class="row"><span>今日领取</span><b id="todayCredit">—</b></div>
      <div class="row"><span>最近执行</span><b id="lastRun">—</b></div>
      <div class="row"><span>下次尝试</span><b id="nextRun">—</b></div>
    </div>
  </div>

  <div class="grid">
    <div class="card mini">
      <div class="k">今日状态</div>
      <div class="v green" id="state">已领取</div>
    </div>
    <div class="card mini">
      <div class="k">连续签到</div>
      <div class="v" id="streak">—</div>
      <div class="sub">天</div>
    </div>
    <div class="card mini">
      <div class="k">下次大奖</div>
      <div class="v" id="reward">—</div>
    </div>
    <div class="card mini">
      <div class="k">令牌到期</div>
      <div class="v" id="expire">—</div>
      <div class="sub" id="expireSub">—</div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0">近 14 天领取</div>
    <div class="days" id="days"></div>
  </div>

  <div class="card detail" style="margin-top:12px">
    <div class="sec-title" style="margin-top:0">积分明细（按资源包）</div>
    <div id="details"></div>
  </div>

  <div class="foot" id="foot">—</div>
</div>

<script>
const DATA = {"mode": "cloud", "stamp": "云端 · 每天 23:58", "points": 1900, "capacity": null, "packs": null, "plan": "Buddy加油站", "todayClaimed": true, "todayCredit": 100, "streak": 19, "nextReward": "—", "lastRun": "2026-11-13 06:00", "nextRun": "明天 23:58（云端）", "tokenExpire": "2027-01-07", "tokenDaysLeft": 55, "days": [{"d": 31, "m": 10, "ok": true, "today": false}, {"d": 1, "m": 11, "ok": true, "today": false}, {"d": 2, "m": 11, "ok": false, "today": false}, {"d": 3, "m": 11, "ok": false, "today": false}, {"d": 4, "m": 11, "ok": true, "today": false}, {"d": 5, "m": 11, "ok": true, "today": false}, {"d": 6, "m": 11, "ok": true, "today": false}, {"d": 7, "m": 11, "ok": false, "today": false}, {"d": 8, "m": 11, "ok": true, "today": false}, {"d": 9, "m": 11, "ok": true, "today": false}, {"d": 10, "m": 11, "ok": true, "today": false}, {"d": 11, "m": 11, "ok": true, "today": false}, {"d": 12, "m": 11, "ok": true, "today": false}, {"d": 13, "m": 11, "ok": true, "today": true}], "details": [{"name": "Buddy加油站", "amount": 1900}], "ok": true, "claimedByCloud": false, "note": "本地已签，云端仅记录"};

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#1fb574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';
const fmt = n => (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString('zh-CN');

document.getElementById('stamp').textContent = DATA.stamp || (DATA.mode === 'demo' ? '示例数据' : '');
document.getElementById('points').textContent = fmt(DATA.points);

const capBits = [];
if (DATA.capacity) capBits.push('总容量 ' + fmt(DATA.capacity));
if (DATA.packs) capBits.push(DATA.packs + ' 个资源包合计');
if (DATA.plan) capBits.push(DATA.plan);
document.getElementById('capacity').textContent = capBits.join(' · ') || '—';

document.getElementById('todayCredit').textContent = (DATA.todayCredit || 0) + ' 分';
document.getElementById('lastRun').textContent = DATA.lastRun || '—';
document.getElementById('nextRun').textContent = DATA.nextRun || '—';
document.getElementById('streak').textContent = DATA.streak ?? '—';
document.getElementById('reward').textContent = DATA.nextReward || '—';
document.getElementById('expire').textContent = DATA.tokenExpire || '—';
document.getElementById('expireSub').textContent = DATA.tokenDaysLeft != null ? ('剩 ' + DATA.tokenDaysLeft + ' 天') : '—';

const claimed = DATA.todayClaimed !== false;
const chip = document.getElementById('chipToday');
chip.querySelector('span:last-child').textContent = claimed ? '今日已自动领取' : '今日待领取';
if (!claimed) { chip.classList.remove('ok'); }
document.getElementById('state').textContent = claimed ? '已领取' : '待领取';
document.getElementById('state').className = 'v ' + (claimed ? 'green' : 'warn');

const daysBox = document.getElementById('days');
(DATA.days || []).forEach(d => {
  const el = document.createElement('div');
  el.className = 'day' + (d.ok ? ' ok' : '') + (d.today ? ' today' : '');
  el.innerHTML = '<div class="mark">' + (d.ok ? CHECK : '') + '</div>' +
                 '<div class="dn">' + d.d + '</div>' +
                 '<div class="dm">' + d.m + '月</div>';
  daysBox.appendChild(el);
});

const det = document.getElementById('details');
const list = DATA.details || [];
if (!list.length) {
  det.innerHTML = '<div class="row"><span>暂无明细</span><b>—</b></div>';
} else {
  const max = Math.max(...list.map(x => Number(x.amount) || 0)) || 1;
  list.forEach(x => {
    const row = document.createElement('div');
    row.style.marginTop = '10px';
    row.innerHTML = '<div class="row" style="padding:0"><span>' + x.name + '</span><b>' +
                    fmt(x.amount) + ' 分</b></div>' +
                    '<div class="bar"><i style="width:' + Math.max(6, (Number(x.amount) || 0) / max * 100) + '%"></i></div>';
    det.appendChild(row);
  });
}

const _src = DATA.note ? (' · ' + DATA.note) : '';
document.getElementById('foot').innerHTML =
  '每日 23:58 云端自动签到' + _src + '<br>本地已签到时云端只记录、不重复领取' +
  (DATA.mode === 'demo' ? '<br><span class="badge">当前为示例数据</span>' : '');
</script>
</body>
</html>
