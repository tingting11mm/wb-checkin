name: WorkBuddy 每日签到

on:
  schedule:
    # GitHub 的 cron 走 UTC。北京时间 = UTC+8
    # 15:45 UTC = 23:45 北京（提前档，防止排程延迟越过零点）
    - cron: '45 15 * * *'
    # 15:58 UTC = 23:58 北京（主档）
    - cron: '58 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wb-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install --quiet cryptography

      - name: 执行签到
        env:
          WB_STATE_KEY: ${{ secrets.WB_STATE_KEY }}
          WB_UID: ${{ secrets.WB_UID }}
        run: python checkin_cloud.py

      - name: 提交看板与令牌状态
        run: |
          git config user.name  "wb-checkin-bot"
          git config user.email "wb-checkin-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "checkin $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
